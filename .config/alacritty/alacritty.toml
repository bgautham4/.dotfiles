[env]
TERM = "xterm-256color"

[general]
import = [
    "~/.config/alacritty/themes/catppuccin-mocha.toml"
]

[font]
#normal = { family = "Iosevka", style = "Regular" }
#bold = { family = "Iosevka", style = "Bold" }
#italic = { family = "Iosevka", style = "Italic" }
#bold_italic = { family = "Iosevka", style = "Bold Italic" }
normal = { family = "Source Code Pro", style = "Regular" }
bold = { family = "Source Code Pro", style = "Bold" }
italic = { family = "Source Code Pro", style = "Italic" }
bold_italic = { family = "Source Code Pro", style = "Bold Italic" }
size = 14.0

[selection]
save_to_clipboard = true
